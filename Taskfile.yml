version: '3'

tasks:
  test:
    cmds:
      - task: install_boto
      - |
        source .venv/bin/activate
        python3 -m pytest
        python3 -m ruff check ./ --fix

  plan:
    task:
      - install_boto
    cmds:
      - task: install_boto
      - |
        source .venv/bin/activate
        python3 src/main.py --dry-run

  apply:
    task:
      - install_boto
    cmds:
      - task: install_boto
      - |
        source .venv/bin/activate
        python3 src/main.py

  install_boto:
    cmds:
      - |
        python3 -m venv .venv
        source .venv/bin/activate
        python3 -m pip install boto3
        python3 -m pip install ruff
        python3 -m pip install pytest
